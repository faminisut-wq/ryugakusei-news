<!doctype html>
<title>とちぎ外国人雇用ニュース便</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Dela+Gothic+One&display=swap">
<style>
/* Layout: 航空便の封筒。縞の帯の下に、新着順の一列リスト */
:root {
  --bg: #eef3f6; --surface: #fff; --fg: #17293a; --muted: #566a7b; --line: #d0dbe3;
  --air-red: #c8323c; --air-blue: #1d4f9c; --accent: #1d4f9c; --on-accent: #fff;
  --display: "Dela Gothic One", "BIZ UDPGothic", sans-serif;
  --body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101a24; --surface: #18252f; --fg: #e8eff4; --muted: #9fb1bf; --line: #2e404e;
  --air-red: #e0636b; --air-blue: #6d9ce6; --accent: #8db4f0; --on-accent: #101a24; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #101a24; --surface: #18252f; --fg: #e8eff4; --muted: #9fb1bf; --line: #2e404e;
  --air-red: #e0636b; --air-blue: #6d9ce6; --accent: #8db4f0; --on-accent: #101a24; color-scheme: dark }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.7 var(--body); }
.stripe { height: 10px; background: repeating-linear-gradient(-45deg, var(--air-red) 0 18px, transparent 18px 36px, var(--air-blue) 36px 54px, transparent 54px 72px); }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 28px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
h1 { margin: 0; font: 400 clamp(1.8rem, 7vw, 2.6rem)/1.2 var(--display); text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: .88rem; }
#q { width: 100%; box-sizing: border-box; padding: 11px 14px; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { padding: 6px 12px; font: inherit; font-size: .88rem; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 99px; cursor: pointer; }
.chips button[aria-pressed="true"] { color: var(--on-accent); background: var(--accent); border-color: var(--accent); font-weight: 700; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
ul { list-style: none; margin: 0; padding: 0; }
li { padding: 15px 0; border-top: 1px solid var(--line); }
li a { display: block; color: inherit; font-weight: 700; text-decoration: none; overflow-wrap: anywhere; }
li a:hover { color: var(--accent); text-decoration: underline; }
.meta { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 4px; color: var(--muted); font-size: .8rem; }
.cat { color: var(--accent); font-weight: 700; }
.note { color: var(--muted); }
</style>
<div class="stripe"></div>
<main class="wrap">
  <header>
    <h1>とちぎ外国人雇用ニュース便</h1>
    <p class="sub" id="status">ニュースを読み込んでいます</p>
  </header>
  <input id="q" type="search" placeholder="キーワードで絞り込む" aria-label="キーワードで絞り込む">
  <div class="chips" id="chips"></div>
  <p class="sub">公式情報: <a href="https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/koyou/gaikokujin/index.html" target="_blank" rel="noopener noreferrer">厚生労働省 外国人雇用対策</a> / <a href="https://www.hellowork.mhlw.go.jp/" target="_blank" rel="noopener noreferrer">ハローワーク求人検索</a></p>
  <ul id="list"></ul>
  <p class="note" id="empty" hidden>条件に合うニュースはありません。別のキーワードやカテゴリを試してください。</p>
</main>
<script>
const $ = (id) => document.getElementById(id);
let items = [], categories = [], cat = 'すべて';
const fmt = (iso, opts) => new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', ...opts }).format(new Date(iso));

function render() {
  const q = $('q').value.trim().toLowerCase();
  const hits = items.filter((i) => (cat === 'すべて' || i.category === cat) && (i.title + i.source).toLowerCase().includes(q));
  $('list').replaceChildren(...hits.map((i) => {
    const li = document.createElement('li'), a = document.createElement('a'), m = document.createElement('div');
    a.href = i.link; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = i.title;
    m.className = 'meta';
    [[i.category, 'cat'], [i.source], [fmt(i.date, { month: 'numeric', day: 'numeric' })]].forEach(([t, c]) => {
      const s = document.createElement('span'); s.textContent = t; if (c) s.className = c; m.append(s);
    });
    li.append(a, m);
    return li;
  }));
  $('empty').hidden = hits.length > 0;
}

function renderChips() {
  $('chips').replaceChildren(...['すべて', ...categories].map((c) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = c; b.setAttribute('aria-pressed', c === cat);
    b.onclick = () => { cat = c; renderChips(); render(); };
    return b;
  }));
}

$('q').oninput = render;
fetch('data/news.json', { cache: 'no-store' })
  .then((r) => { if (!r.ok) throw 0; return r.json(); })
  .then((d) => {
    items = d.items; categories = d.categories;
    $('status').textContent = `${fmt(d.updatedAt, { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })} 更新 / ${items.length} 件`;
    renderChips(); render();
  })
  .catch(() => { $('status').textContent = 'ニュースを読み込めませんでした。ページを再読み込みしてください。'; });
</script>
